name: ARX field stream smoke

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - '.github/workflows/field-stream-smoke.yml'

jobs:
  field-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build x86_64-capable debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Verify field URLs answer from GitHub runner
        shell: bash
        env:
          MOBLAND_URL: 'https://newgenres.duckdns.org/TS-DE/stream/MobLand.S01E04.1080p.WEB-DL.RGzsRutracker.mkv?link=3198e8861318732299b77913076857c75a6bc754&index=4&play'
          HEVC_URL: 'https://newgenres.duckdns.org/TS-DE/stream/Undead%20Unluck%20-%2006%20%5BBDRip%201080p%20HEVC%2010bits%20FLAC%5D.mkv?link=cc52091494a2298cc6f724c871ab7ba6e28bba82&index=6&play'
        run: |
          set -euo pipefail
          mkdir -p field-stream-smoke
          # A small ranged read proves DNS/TLS/server/range access without downloading the episode.
          for name in mobland undead-hevc10; do
            if [[ "$name" == "mobland" ]]; then URL="$MOBLAND_URL"; else URL="$HEVC_URL"; fi
            code="$(curl -L --fail --silent --show-error --range 0-262143               --connect-timeout 20 --max-time 90               -o /dev/null -w '%{http_code}' "$URL")"
            echo "$name HTTP $code"
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Play both real server streams
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBLAND_URL: 'https://newgenres.duckdns.org/TS-DE/stream/MobLand.S01E04.1080p.WEB-DL.RGzsRutracker.mkv?link=3198e8861318732299b77913076857c75a6bc754&index=4&play'
          HEVC_URL: 'https://newgenres.duckdns.org/TS-DE/stream/Undead%20Unluck%20-%2006%20%5BBDRip%201080p%20HEVC%2010bits%20FLAC%5D.mkv?link=cc52091494a2298cc6f724c871ab7ba6e28bba82&index=6&play'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p field-stream-smoke
            APK="$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' -type f | head -n1)"
            test -n "$APK"
            adb install -r "$APK"

            run_case() {
              local name="$1"
              local url="$2"
              local expect_hevc="$3"
              local dir="field-stream-smoke/$name"
              mkdir -p "$dir"

              echo "=== CASE: $name ==="
              adb shell am force-stop com.justplus.player || true
              adb logcat -c

              # One remote shell command so '&' in the query string cannot be interpreted by the device shell.
              adb shell "am start -W                 -n com.justplus.player/com.brouken.player.PlayerActivity                 -a android.intent.action.VIEW                 -t video/x-matroska                 -d '$url'" > "$dir/am-start.txt"

              local deadline=$((SECONDS + 120))
              local ready=0
              local playing=0
              local frame=0
              while (( SECONDS < deadline )); do
                adb logcat -d -v threadtime > "$dir/logcat.txt" || true

                grep -q "state READY" "$dir/logcat.txt" && ready=1 || true
                grep -q "playing=true" "$dir/logcat.txt" && playing=1 || true
                grep -q "first frame rendered" "$dir/logcat.txt" && frame=1 || true

                if grep -q "FATAL EXCEPTION" "$dir/logcat.txt" &&
                   grep -q "Process: com.justplus.player" "$dir/logcat.txt"; then
                  echo "::error::$name crashed"
                  break
                fi

                if (( ready && playing && frame )); then
                  break
                fi
                sleep 2
              done

              adb logcat -d -v threadtime > "$dir/logcat.txt" || true
              adb shell dumpsys media.codec > "$dir/media-codec.txt" || true
              adb shell dumpsys activity activities > "$dir/activity.txt" || true

              # Show controller before taking evidence screenshot.
              adb shell input tap 540 1050 || true
              sleep 1
              adb exec-out screencap -p > "$dir/player.png" || true
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$dir/window.xml" >/dev/null 2>&1 || true

              {
                echo "case=$name"
                echo "ready=$ready"
                echo "playing=$playing"
                echo "first_frame=$frame"
                echo
                echo "--- relevant playback log ---"
                grep -E "video input:|video decoder: init|audio decoder: init|state (IDLE|BUFFERING|READY|ENDED)|playing=|first frame rendered|rebuild: HEVC|NextLib FFmpeg|ERROR_CODE_|codec error|FATAL EXCEPTION"                   "$dir/logcat.txt" | tail -n 200 || true
              } | tee "$dir/result.txt"

              if [[ "$expect_hevc" == "yes" ]]; then
                if ! grep -q "video input: video/hevc" "$dir/logcat.txt"; then
                  echo "::error::$name did not expose a HEVC video track"
                  return 1
                fi
                if grep -q "NextLib FFmpeg/libavcodec video decoder" "$dir/logcat.txt"; then
                  echo "HEVC path: NextLib FFmpeg fallback was exercised" | tee -a "$dir/result.txt"
                else
                  decoder="$(grep "video decoder: init" "$dir/logcat.txt" | tail -n1 || true)"
                  echo "HEVC path: platform/software MediaCodec survived on this emulator; no forced fallback. $decoder"                     | tee -a "$dir/result.txt"
                fi
              fi

              if (( !ready || !playing || !frame )); then
                echo "::error::$name playback failed: READY=$ready playing=$playing first_frame=$frame"
                return 1
              fi
              echo "$name: PASS"
            }

            run_case "mobland-h264" "$MOBLAND_URL" "no"
            run_case "undead-hevc10" "$HEVC_URL" "yes"

      - name: Upload field playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARX-field-stream-smoke
          path: field-stream-smoke/
          if-no-files-found: warn
          retention-days: 7
