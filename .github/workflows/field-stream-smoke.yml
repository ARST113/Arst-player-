name: ARX field stream smoke

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - '.github/workflows/field-stream-smoke.yml'

jobs:
  field-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build x86_64-capable debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Verify field URLs answer from GitHub runner
        shell: bash
        env:
          MOBLAND_URL: 'https://newgenres.duckdns.org/TS-DE/stream/MobLand.S01E04.1080p.WEB-DL.RGzsRutracker.mkv?link=3198e8861318732299b77913076857c75a6bc754&index=4&play'
          HEVC_URL: 'https://newgenres.duckdns.org/TS-DE/stream/Undead%20Unluck%20-%2006%20%5BBDRip%201080p%20HEVC%2010bits%20FLAC%5D.mkv?link=cc52091494a2298cc6f724c871ab7ba6e28bba82&index=6&play'
        run: |
          set -euo pipefail
          mkdir -p field-stream-smoke
          # A small ranged read proves DNS/TLS/server/range access without downloading the episode.
          for name in mobland undead-hevc10; do
            if [[ "$name" == "mobland" ]]; then URL="$MOBLAND_URL"; else URL="$HEVC_URL"; fi
            set +e
            code="$(curl -L --silent --show-error --range 0-262143               --connect-timeout 20 --max-time 90               -o /dev/null -w '%{http_code}' "$URL")"
            rc=$?
            set -e
            echo "$name preflight: curl_rc=$rc HTTP=$code"
            # Informational only. Some field servers authorize differently for the player request;
            # the emulator is the actual test and must run even when this preflight gets 401/403.
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Play both real server streams
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBLAND_URL: 'https://newgenres.duckdns.org/TS-DE/stream/MobLand.S01E04.1080p.WEB-DL.RGzsRutracker.mkv?link=3198e8861318732299b77913076857c75a6bc754&index=4&play'
          HEVC_URL: 'https://newgenres.duckdns.org/TS-DE/stream/Undead%20Unluck%20-%2006%20%5BBDRip%201080p%20HEVC%2010bits%20FLAC%5D.mkv?link=cc52091494a2298cc6f724c871ab7ba6e28bba82&index=6&play'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/field-stream-smoke.sh

      - name: Upload field playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARX-field-stream-smoke
          path: field-stream-smoke/
          if-no-files-found: warn
          retention-days: 7
