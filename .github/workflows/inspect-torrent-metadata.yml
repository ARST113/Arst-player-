name: Read-only TorrServer torrent metadata and cache status
on:
  push:
    branches: [diagnostics/mp4-audio-dropout-20261013]
    paths:
      - '.github/workflows/inspect-torrent-metadata.yml'
      - '.github/scripts/inspect-torrent-metadata.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  torrent-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch read-only torrent metadata and test HTTP byte range
        run: bash .github/scripts/inspect-torrent-metadata.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torrent-metadata-inspection
          path: torrent-metadata-inspection/
          retention-days: 7
          if-no-files-found: warn
