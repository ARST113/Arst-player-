name: Fix validation

on:
  push:
    branches:
      - fix-playlist-hevc-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compile debug and release, run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleLatestUniversalDebug \
            :app:assembleLatestUniversalRelease \
            :app:testLatestUniversalDebugUnitTest

      - name: Generate local HEVC media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/player-smoke
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc=size=640x360:rate=24" \
            -t 5 -an -c:v libx265 -preset ultrafast -pix_fmt yuv420p \
            -tag:v hvc1 -movflags +faststart \
            /tmp/player-smoke/one.mp4
          cp /tmp/player-smoke/one.mp4 /tmp/player-smoke/two.mp4

      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Emulator playlist and HEVC smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            adb install -r "$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' | head -n 1)"
            nohup python3 -m http.server 8765 --directory /tmp/player-smoke >/tmp/player-http.log 2>&1 &
            sleep 2

            # Reproduce the old Lampa/package-launch path: launcher Activity + legacy video_list extras.
            adb logcat -c
            adb shell am force-stop com.justplus.player
            adb shell am start -W \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              -n com.justplus.player/com.brouken.player.BrowserActivity \
              -d "http://10.0.2.2:8765/one.mp4" \
              --esa video_list "http://10.0.2.2:8765/one.mp4,http://10.0.2.2:8765/two.mp4" \
              --esa video_list.name "Episode 1,Episode 2"
            sleep 8

            adb shell pidof com.justplus.player
            adb shell dumpsys activity activities | grep -m1 "mResumedActivity" | grep "com.brouken.player.PlayerActivity"
            adb logcat -d > /tmp/player-logcat.txt
            grep -F "api playlist: 2 items" /tmp/player-logcat.txt
            grep -q "GET /one.mp4" /tmp/player-http.log

            # Playback must survive long enough to prove the forwarded media reached the renderer.
            sleep 8
            adb shell pidof com.justplus.player
            adb logcat -d > /tmp/player-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.justplus\.player.*has died|AndroidRuntime.*com\.justplus\.player" /tmp/player-logcat.txt || { echo "Player crashed"; exit 1; }

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: just-plus-player-fixed-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            app/build/outputs/apk/latestUniversal/release/*.apk
            /tmp/player-logcat.txt
            /tmp/player-http.log
