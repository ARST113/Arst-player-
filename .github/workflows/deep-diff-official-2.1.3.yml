name: Deep diff official 2.1.2 vs 2.1.3

on:
  push:
    branches:
      - audit-official-2.1.3
    paths:
      - '.github/workflows/deep-diff-official-2.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-official-2.1.3
          fetch-depth: 0
      - name: Download and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk
          curl -fL --retry 3 -o /tmp/apk/212.apk https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.2/JustPlus.Player.v2.1.2.apk
          curl -fL --retry 3 -o /tmp/apk/213.apk https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.3/JustPlus.Player.v2.1.3.apk
          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 3 -o /tmp/apk/jadx.zip "$JADX_URL"
          unzip -q /tmp/apk/jadx.zip -d /tmp/apk/jadx
          /tmp/apk/jadx/bin/jadx --show-bad-code -d /tmp/apk/j212 /tmp/apk/212.apk >/tmp/apk/212.log 2>&1 || true
          /tmp/apk/jadx/bin/jadx --show-bad-code -d /tmp/apk/j213 /tmp/apk/213.apk >/tmp/apk/213.log 2>&1 || true
      - name: Produce class diffs
        shell: bash
        run: |
          set -euo pipefail
          OUT=apk-2.1.3-class-diff.txt
          : > "$OUT"
          for rel in             com/brouken/player/PlayerActivity.java             com/brouken/player/App.java             com/brouken/player/BottomBarLayout.java             com/brouken/player/BrandWash.java             com/brouken/player/BrowserActivity.java             com/brouken/player/CustomDefaultTimeBar.java             com/brouken/player/ErrorActivity.java             com/brouken/player/LevelBar.java             com/brouken/player/RatioFrame.java             com/brouken/player/SettingsActivity.java; do
            echo "===== $rel =====" >> "$OUT"
            diff -u "/tmp/apk/j212/sources/$rel" "/tmp/apk/j213/sources/$rel" >> "$OUT" || true
            echo >> "$OUT"
          done
          # Save the 2.1.3 PlayerActivity separately for targeted inspection.
          cp /tmp/apk/j213/sources/com/brouken/player/PlayerActivity.java apk-2.1.3-PlayerActivity-jadx.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT" apk-2.1.3-PlayerActivity-jadx.java
          git commit -m "Audit: persist deep official 2.1.3 class diff [skip ci]" || true
          git push origin HEAD:audit-official-2.1.3
