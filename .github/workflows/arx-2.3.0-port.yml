name: ARX 2.3.0 port validation

on:
  push:
    branches:
      - arx/v2.3.0-port
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'docs/ARX-2.3.0-port.md'
      - '.github/workflows/arx-2.3.0-port.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    # Historical v2.3.0 ABI/version assertions apply only to the v2.3.0 port.
    # Newer port PRs (2.4.x) use their own SHA-pinned workflows.
    if: github.event_name != 'pull_request' || github.head_ref == 'arx/v2.3.0-port'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build unsigned and signed release
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleLatestUniversalRelease :app:testLatestUniversalDebugUnitTest
      - name: Print unit-test failure details
        if: failure()
        shell: bash
        run: |
          find app/build/test-results -name '*.xml' -type f -maxdepth 5 -print -exec sed -n '1,140p' {} \; || true
      - name: Verify signed APK, ABI libraries and package version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/latestUniversal/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" | grep -F "versionName='2.3.0-arx2'"
          "$signer" verify --print-certs "$apk"
          for abi in arm64-v8a armeabi-v7a; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libffmpegJNI.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libffvideoJNI.so"
          done
          # Compare with exact native libraries extracted from official Just+ Player 2.3.0.
          test "$(unzip -p "$apk" lib/arm64-v8a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = "7c50ed7526e2a78fe9c61bf3059f887f2610e23a9ecd92cedb0041c1489f0536"
          test "$(unzip -p "$apk" lib/armeabi-v7a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = "1e54c5b39726a9a907eb797099edfd5bc84dfbc152b10653eb5637bbc562c14b"
          test "$(unzip -p "$apk" lib/arm64-v8a/libffvideoJNI.so | sha256sum | cut -d' ' -f1)" = "9a98e6c9ee6e53ca301910a30839ef6bd91f6b4d6103a325855ef28cdbeb34ec"
          test "$(unzip -p "$apk" lib/armeabi-v7a/libffvideoJNI.so | sha256sum | cut -d' ' -f1)" = "836665bd468eeb2bf5ad91e0e69ac871b8ce587998a59d286dc9a85756a0ee5b"
          echo "Native FFmpeg audio/video libraries match official 2.3.0 on both ARM ABIs."
          sha256sum "$apk"
      - name: Verify in-place upgrade eligibility from ARX 2.2.2-arx3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arx-upgrade-evidence
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
            'https://github.com/ARST113/Arst-player-/releases/download/arx-v2.2.2-arx3/ARX.TPlayer.v2.2.2-arx3-release.apk' \
            -o /tmp/arx-previous-release.apk
          old=/tmp/arx-previous-release.apk
          new="$(find app/build/outputs/apk/latestUniversal/release -maxdepth 1 -name '*.apk' | head -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$signer" verify --print-certs "$old" > arx-upgrade-evidence/old-cert.txt
          "$signer" verify --print-certs "$new" > arx-upgrade-evidence/new-cert.txt
          "$aapt" dump badging "$old" | head -n1 > arx-upgrade-evidence/old-package.txt
          "$aapt" dump badging "$new" | head -n1 > arx-upgrade-evidence/new-package.txt
          old_code="$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" arx-upgrade-evidence/old-package.txt)"
          new_code="$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" arx-upgrade-evidence/new-package.txt)"
          old_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' arx-upgrade-evidence/old-cert.txt)"
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' arx-upgrade-evidence/new-cert.txt)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          test "$new_code" -gt "$old_code"
          grep -Fq "name='com.justplus.player'" arx-upgrade-evidence/old-package.txt
          grep -Fq "name='com.justplus.player'" arx-upgrade-evidence/new-package.txt
          echo "Upgrade eligible: same package and signing certificate; versionCode $old_code -> $new_code"
      - name: Verify branding and banner removal
        run: |
          ! grep -R -E 'aboutDeco|stand_ukraine|deco_line_[12]|STAND WITH|UKRAINE' \
            app/src/main/res/xml/root_preferences.xml \
            app/src/main/java/com/brouken/player/SettingsActivity.java \
            app/src/main/res/values/strings.xml
          test ! -e app/src/main/res/layout/preference_about_deco.xml
          test ! -e app/src/main/res/layout/preference_stand_with_ukraine.xml
          grep -q 'api.github.com/repos/ARST113/Arst-player-/releases' \
            app/src/main/java/com/brouken/player/update/Updater.java
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARX-v2.3.0-port-test
          path: app/build/outputs/apk/latestUniversal/release/*.apk
          retention-days: 7
