name: ARX 2.3.0 emulator integration smoke

on:
  workflow_dispatch:
  push:
    branches:
      - arx/v2.3.0-port
    paths:
      - '.github/workflows/arx-2.3.0-emulator.yml'
      - '.github/scripts/arx-230-emulator-smoke.sh'

permissions:
  contents: read

jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build current debug APK and run JVM regression tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleLatestUniversalDebug :app:testLatestUniversalDebugUnitTest
          bash -n .github/scripts/arx-230-emulator-smoke.sh

      - name: Generate deterministic offline video and subtitle fixtures
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          mkdir -p arx-230-fixtures arx-230-evidence
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 48 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            arx-230-fixtures/h264-aac.mp4
          cat > arx-230-fixtures/forced.srt <<'SRT'
          1
          00:00:03,000 --> 00:00:10,000
          Forced foreign-language sign
          SRT
          cat > arx-230-fixtures/full.srt <<'SRT'
          1
          00:00:04,000 --> 00:00:12,000
          Проверка полных субтитров
          SRT
          ffmpeg -hide_banner -loglevel error -y \
            -i arx-230-fixtures/h264-aac.mp4 \
            -i arx-230-fixtures/forced.srt -i arx-230-fixtures/full.srt \
            -map 0:v:0 -map 0:a:0 -map 1:0 -map 2:0 \
            -c:v copy -c:a copy -c:s srt \
            -metadata:s:s:0 language=eng -metadata:s:s:0 title="English Forced" \
            -disposition:s:0 forced \
            -metadata:s:s:1 language=und -metadata:s:s:1 title="Русские полные" \
            -disposition:s:1 default \
            arx-230-fixtures/subtitles.mkv
          ffmpeg -hide_banner -loglevel error -y \
            -i arx-230-fixtures/h264-aac.mp4 -an -c:v mpeg4 -q:v 5 \
            -vtag XVID arx-230-fixtures/mp4v.avi
          for file in h264-aac.mp4 subtitles.mkv mp4v.avi; do
            ffprobe -v error -show_entries stream=codec_name,codec_type,codec_tag_string:stream_tags=language,title \
              -of compact "arx-230-fixtures/$file" | tee -a arx-230-evidence/fixture-codecs.txt
          done
          setsid python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory arx-230-fixtures \
            </dev/null > arx-230-evidence/http-server.txt 2>&1 &
          for i in {1..15}; do
            if curl -sf -o /dev/null http://127.0.0.1:8765/h264-aac.mp4; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8765/subtitles.mkv

      - name: Enable hardware acceleration for Android Emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch emulator and test playback, subtitles, AVI, background and About
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/arx-230-emulator-smoke.sh

      - name: Upload diagnostics even if emulator fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARX-2.3.0-emulator-offline-evidence
          path: |
            arx-230-evidence/
            app/build/test-results/testLatestUniversalDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn
