name: Extract official 2.1.3 chrome internals

on:
  push:
    branches:
      - audit-official-2.1.3
    paths:
      - '.github/workflows/extract-official-chrome-internals.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-official-2.1.3
          fetch-depth: 0

      - name: Download official APK and JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/j
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.3/JustPlus.Player.v2.1.3.apk \
            -o /tmp/j/official.apk
          echo "3e8bff06ebc1037142107c5c8321249c9a3fc4569de8d8be40e53716c5b042dc  /tmp/j/official.apk" | sha256sum -c -
          API=https://api.github.com/repos/skylot/jadx/releases/latest
          JADX_URL="$(curl -fsSL "$API" | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 3 -o /tmp/j/jadx.zip "$JADX_URL"
          unzip -q /tmp/j/jadx.zip -d /tmp/j/jadx
          /tmp/j/jadx/bin/jadx --show-bad-code -d /tmp/j/out /tmp/j/official.apk >/tmp/j/jadx.log 2>&1 || true

      - name: Persist chrome classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-apk-chrome
          for c in xr ss2 yt2; do
            src="$(find /tmp/j/out/sources -type f -name "$c.java" | head -n1)"
            test -n "$src"
            cp "$src" "official-apk-chrome/$c.java"
          done
          git config user.name arx-ui-audit
          git config user.email actions@users.noreply.github.com
          git add official-apk-chrome
          git diff --cached --quiet && exit 0
          git commit -m "Audit: extract official 2.1.3 chrome internals [skip ci]"
          git pull --rebase origin audit-official-2.1.3
          git push origin HEAD:audit-official-2.1.3
