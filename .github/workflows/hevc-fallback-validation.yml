name: HEVC fallback validation

on:
  push:
    branches:
      - upstream-hevc-ffmpeg-fallback-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and unit test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleLatestUniversalDebug \
            :app:testLatestUniversalDebugUnitTest
