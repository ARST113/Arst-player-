name: Restore official 2.2.2 settings icons

on:
  push:
    branches: [reconstruct-2.2.2]
    paths: ['.github/workflows/import-v222-settings-icons.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruct-2.2.2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download SHA-256-verified reference and JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/just-plus-player/just-plus-player/releases/download/v2.2.2/JustPlus.Player.v2.2.2.apk -o /tmp/official.apk
          echo '1e69816c14cedc30929e9e59657a6a8ac766fcd22b584774fc85aa9ec79bd916  /tmp/official.apk' | sha256sum -c -
          curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest -o /tmp/jadx.json
          url="$(jq -r '[.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$"))][0].browser_download_url // empty' /tmp/jadx.json)"
          test -n "$url"
          curl -fsSL --retry 3 "$url" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Extract only missing official vectors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/jadx/bin/jadx -j 4 --no-src -d /tmp/out /tmp/official.apk >/tmp/jadx.log 2>&1 || true
          for icon in ic_bug_report_24dp.xml ic_double_arrow_24dp.xml; do
            source="$(find /tmp/out/resources/res -type f -name "$icon" | head -n1)"
            test -n "$source" && test -s "$source"
            cp "$source" "app/src/main/res/drawable/$icon"
            echo "Imported $icon ($(wc -c < "app/src/main/res/drawable/$icon") bytes)"
          done
      - name: Commit exact resource vectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable/ic_bug_report_24dp.xml app/src/main/res/drawable/ic_double_arrow_24dp.xml
          if ! git diff --cached --quiet; then
            git commit -m 'ui: restore original 2.2.2 section icons'
            git fetch origin reconstruct-2.2.2
            git rebase origin/reconstruct-2.2.2
            git push origin HEAD:reconstruct-2.2.2
          fi
