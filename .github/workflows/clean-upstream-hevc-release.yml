name: Clean upstream HEVC signed release

on:
  push:
    branches:
      - clean-upstream-hevc-only-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Force release version metadata
        run: |
          git tag -f v2.1.1

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleLatestUniversalRelease

      - name: Sign release with test key
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/test-release.jks \
            -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ARST113 Test Release,O=ARST113,C=FI"
          APK="$(find app/build/outputs/apk/latestUniversal/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks /tmp/test-release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out /tmp/JustPlus.Player.v2.1.1-hevc-test-release.apk \
            "$APK"
          "$APKSIGNER" verify --verbose /tmp/JustPlus.Player.v2.1.1-hevc-test-release.apk

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: clean-upstream-hevc-signed-release
          if-no-files-found: error
          path: /tmp/JustPlus.Player.v2.1.1-hevc-test-release.apk
