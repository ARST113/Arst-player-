name: Extract official 2.1.3 header UI

on:
  push:
    branches:
      - audit-official-2.1.3
    paths:
      - '.github/workflows/extract-official-header-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-official-2.1.3
          fetch-depth: 0
      - name: Decompile official APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk
          curl -fL --retry 3 -o /tmp/apk/app.apk https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.3/JustPlus.Player.v2.1.3.apk
          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 3 -o /tmp/apk/jadx.zip "$JADX_URL"
          unzip -q /tmp/apk/jadx.zip -d /tmp/apk/jadx
          /tmp/apk/jadx/bin/jadx --show-bad-code -d /tmp/apk/out /tmp/apk/app.apk >/tmp/apk/jadx.log 2>&1 || true

      - name: Persist exact header resources and prefs class
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/apk/out/resources/res/xml/root_preferences.xml apk-2.1.3-root_preferences.xml
          cp /tmp/apk/out/resources/res/values/arrays.xml apk-2.1.3-arrays.xml
          cp /tmp/apk/out/sources/defpackage/hu1.java apk-2.1.3-prefs-jadx.java
          {
            echo '=== PlayerActivity around header setup ==='
            sed -n '11900,12150p' /tmp/apk/out/sources/com/brouken/player/PlayerActivity.java
            echo
            echo '=== PlayerActivity around header update ==='
            sed -n '3800,3905p' /tmp/apk/out/sources/com/brouken/player/PlayerActivity.java
            echo
            echo '=== prefs headerArt hits ==='
            grep -nE 'z0|header|logo|poster' /tmp/apk/out/sources/defpackage/hu1.java | head -n 300 || true
          } > apk-2.1.3-header-ui-evidence.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apk-2.1.3-root_preferences.xml apk-2.1.3-arrays.xml apk-2.1.3-prefs-jadx.java apk-2.1.3-header-ui-evidence.txt
          git commit -m "Audit: persist official 2.1.3 header UI evidence [skip ci]" || true
          git push origin HEAD:audit-official-2.1.3
