name: Android emulator reproduce fifth-episode sound loss on real TorrServer
on:
  push:
    branches: [diagnostics/mp4-audio-dropout-20261013]
    paths:
      - '.github/workflows/repro-mouse-ep5-android.yml'
      - '.github/scripts/repro-mouse-ep5-android.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android15-ep5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARX-2.4.1-preview-build-apks
          run-id: 38276420080
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/latestUniversal
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot emulator, play real fifth episode, attempt seek and record audio logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/repro-mouse-ep5-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp4-android-emulator
          path: mp4-android-emulator/
          retention-days: 7
          if-no-files-found: warn
