name: CI build and emulator smoke

on:
  push:
    branches:
      - ci-emulator-check-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compile debug and release, run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleLatestUniversalDebug \
            :app:assembleLatestUniversalRelease \
            :app:testLatestUniversalDebugUnitTest

      - name: Generate local HEVC smoke clip
        run: |
          mkdir -p /tmp/player-smoke
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc=size=640x360:rate=24" \
            -t 3 -an -c:v libx265 -preset ultrafast -pix_fmt yuv420p \
            -tag:v hvc1 -movflags +faststart \
            /tmp/player-smoke/hevc.mp4
          ls -lh /tmp/player-smoke/hevc.mp4

      - name: Emulator smoke test on Android 16 / API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euxo pipefail

            APK="$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' | head -n 1)"
            test -n "$APK"
            adb install -r "$APK"

            adb logcat -c
            adb shell am force-stop com.justplus.player
            adb shell monkey -p com.justplus.player -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.justplus.player

            python3 -m http.server 8765 --directory /tmp/player-smoke >/tmp/player-http.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            sleep 2

            adb logcat -c
            adb shell am start -W \
              -a android.intent.action.VIEW \
              -d "http://10.0.2.2:8765/hevc.mp4" \
              -t "video/mp4" \
              com.justplus.player
            sleep 12

            adb shell pidof com.justplus.player
            adb logcat -d > /tmp/player-logcat.txt

            if grep -E "FATAL EXCEPTION|Process: com\.justplus\.player.*has died|AndroidRuntime.*com\.justplus\.player" /tmp/player-logcat.txt; then
              echo "Player crashed during emulator smoke test"
              exit 1
            fi

            if ! grep -E "MediaCodec|VideoRenderer|PlayerActivity|ExoPlayer" /tmp/player-logcat.txt >/dev/null; then
              echo "Warning: no codec/player markers found in logcat; startup survived but playback evidence is limited."
            fi

      - name: Upload APK and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: just-plus-player-ci-smoke
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            app/build/outputs/apk/latestUniversal/release/*.apk
            /tmp/player-logcat.txt
            /tmp/player-http.log