name: Nested playlist emulator validation

on:
  push:
    branches:
      - nested-playlist-emulator-test-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build universal debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleLatestUniversalDebug

      - name: Prepare two local videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/playlist-smoke
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x180:rate=24" \
            -t 6 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart \
            /tmp/playlist-smoke/one.mp4
          cp /tmp/playlist-smoke/one.mp4 /tmp/playlist-smoke/two.mp4

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Validate Lampa 1.13.3 nested playlist
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            adb install -r "$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' | head -n 1)"
            nohup python3 -m http.server 8765 --directory /tmp/playlist-smoke >/tmp/playlist-http.log 2>&1 &
            sleep 2
            adb logcat -c
            adb shell am force-stop com.justplus.player
            adb shell am start -W -n com.justplus.player/com.brouken.player.NestedPlaylistProbeActivity
            sleep 10
            adb shell pidof com.justplus.player
            adb shell dumpsys activity activities | grep -m1 "mResumedActivity" | grep "com.brouken.player.PlayerActivity"
            adb logcat -d > /tmp/playlist-logcat.txt
            grep -F "nested playlist adapted: 2 items, start=1" /tmp/playlist-logcat.txt
            grep -q "GET /two.mp4" /tmp/playlist-http.log
            ! grep -E "FATAL EXCEPTION|Process: com\.justplus\.player.*has died|AndroidRuntime.*com\.justplus\.player" /tmp/playlist-logcat.txt

      - name: Upload debug APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-playlist-validation
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            /tmp/playlist-logcat.txt
            /tmp/playlist-http.log
