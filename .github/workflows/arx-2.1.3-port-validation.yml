name: ARX 2.1.3 port validation

on:
  push:
    branches:
      - arx-2.1.3-port-wip
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: ./gradlew :app:assembleLatestUniversalDebug :app:assembleLatestUniversalRelease :app:testLatestUniversalDebugUnitTest
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ARX-TPlayer-2.1.3-port-apks
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            app/build/outputs/apk/latestUniversal/release/*.apk
          if-no-files-found: error
