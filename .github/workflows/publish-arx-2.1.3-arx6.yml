name: Publish ARX TPlayer 2.1.3-arx6

on:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - '.github/workflows/publish-arx-2.1.3-arx6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate debug, release and unit tests
        run: ./gradlew :app:assembleLatestUniversalDebug :app:assembleLatestUniversalRelease :app:testLatestUniversalDebugUnitTest
      - name: Build signed release APK
        run: ./gradlew :app:assembleLatestUniversalRelease
      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/latestUniversal/release -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" /tmp/ARX.TPlayer.v2.1.3-arx6-release.apk
          sha256sum /tmp/ARX.TPlayer.v2.1.3-arx6-release.apk
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="arx-v2.1.3-arx6"
          APK="/tmp/ARX.TPlayer.v2.1.3-arx6-release.apk"
          TARGET_SHA="$(git rev-parse HEAD)"
          NOTES="UI-parity release: the player chrome is ported 1:1 from the published Just+ Player 2.1.3 APK -- header scrim, timeline metrics, per-appearance palette, metadata rule, playlist and quality glyphs -- and each change is verified against that APK by the UI-reference-compare workflow. Preserves the ARX HEVC/FFmpeg fallback, the Lampa playlist integration and TV key-scrub."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
              --title "ARX TPlayer 2.1.3-arx6" --notes "$NOTES"
          fi
