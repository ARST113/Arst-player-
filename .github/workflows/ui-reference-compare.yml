name: UI reference compare

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - 'app/src/main/java/com/brouken/player/PlayerActivity.java'
      - 'app/src/main/java/com/brouken/player/UiMetrics.java'
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/values/**'
      - 'app/src/main/res/drawable/**'
      - '.github/scripts/ui-reference-compare.sh'
      - '.github/scripts/chrome-report.py'
      - '.github/fixtures/**'
      - '.github/workflows/ui-reference-compare.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build ARX debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Download exact official 2.1.3 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/JustPlus.Player.v2.1.3.apk             https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.3/JustPlus.Player.v2.1.3.apk
          echo "3e8bff06ebc1037142107c5c8321249c9a3fc4569de8d8be40e53716c5b042dc  /tmp/JustPlus.Player.v2.1.3.apk" | sha256sum -c -

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow numpy

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture official and ARX on the same emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 1500 bash .github/scripts/ui-reference-compare.sh

      - name: Upload side-by-side UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-2.1.3-vs-arx-ui
          path: ui-reference/
          if-no-files-found: warn
          retention-days: 7
