name: Audit official Just+ 2.1.2 APK

on:
  push:
    branches:
      - arx-2.1.2-port-wip
    paths:
      - '.github/workflows/audit-official-2.1.2.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.2-port-wip
          fetch-depth: 0

      - name: Download official APKs and JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-audit
          curl -fL --retry 3 -o /tmp/apk-audit/2.1.1.apk             https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.1/JustPlus.Player.v2.1.1.apk
          curl -fL --retry 3 -o /tmp/apk-audit/2.1.2.apk             https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.2/JustPlus.Player.v2.1.2.apk
          echo "2.1.1:"
          sha256sum /tmp/apk-audit/2.1.1.apk
          echo "2.1.2:"
          sha256sum /tmp/apk-audit/2.1.2.apk

          API=https://api.github.com/repos/skylot/jadx/releases/latest
          JADX_URL="$(curl -fsSL "$API" | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$JADX_URL" && test "$JADX_URL" != null
          curl -fL --retry 3 -o /tmp/apk-audit/jadx.zip "$JADX_URL"
          unzip -q /tmp/apk-audit/jadx.zip -d /tmp/apk-audit/jadx

      - name: Decompile 2.1.1 and 2.1.2
        shell: bash
        run: |
          set -euo pipefail
          /tmp/apk-audit/jadx/bin/jadx --no-res --show-bad-code             -d /tmp/apk-audit/jadx211 /tmp/apk-audit/2.1.1.apk >/tmp/apk-audit/jadx211.log 2>&1 || true
          /tmp/apk-audit/jadx/bin/jadx --no-res --show-bad-code             -d /tmp/apk-audit/jadx212 /tmp/apk-audit/2.1.2.apk >/tmp/apk-audit/jadx212.log 2>&1 || true
          echo "2.1.1 java files: $(find /tmp/apk-audit/jadx211/sources -name '*.java' | wc -l)"
          echo "2.1.2 java files: $(find /tmp/apk-audit/jadx212/sources -name '*.java' | wc -l)"

      - name: Compare decompiled Java
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          roots = {211: Path('/tmp/apk-audit/jadx211/sources'), 212: Path('/tmp/apk-audit/jadx212/sources')}
          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*.java')}
          a,b=files(roots[211]),files(roots[212])
          def norm(p):
              s=p.read_text(errors='replace')
              # Resource IDs and decompiler labels are noisy between APKs.
              s=re.sub(r'0x7f[0-9a-fA-F]{6}', '0x7fXXXXXX', s)
              s=re.sub(r'/\* JADX WARN:.*?\*/', '', s)
              return s
          changed=[]
          for k in sorted(set(a)|set(b)):
              if k not in a: changed.append(('ADDED',k,0,len(b[k].read_text(errors='replace').splitlines())))
              elif k not in b: changed.append(('REMOVED',k,len(a[k].read_text(errors='replace').splitlines()),0))
              elif norm(a[k]) != norm(b[k]):
                  changed.append(('CHANGED',k,len(a[k].read_text(errors='replace').splitlines()),len(b[k].read_text(errors='replace').splitlines())))
          print('=== ALL CHANGED JAVA FILES ===')
          for row in changed:
              print('%s\t%s\t%s->%s' % row)
          print('TOTAL_CHANGED', len(changed))
          print('=== APP / SMALL OBFUSCATED CANDIDATES ===')
          for row in changed:
              path=row[1]
              if ('brouken' in path.lower() or re.search(r'(^|/)(vs1|vp2|rs1|us1|c7|b7)\\.java$',path)):
                  print('%s\t%s\t%s->%s' % row)
          PY

      - name: Locate 2.1.2 feature signatures
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/apk-audit/jadx212/sources
          echo '=== FEATURE SIGNATURE LOCATIONS ==='
          for pat in             'resume_mode' 'position_ms' 'duration_ms' 'positions_ms' 'ended_at'             'Opening' 'Credits' 'Intro' 'chapter' 'Retry'             'Set-Cookie' 'Cookie' 'User-Agent' 'Referer'             'frameRate' 'refreshRate' 'display mode' 'AVI' 'idx1' 'movi'; do
            echo "--- $pat ---"
            grep -RniF --include='*.java' "$pat" "$ROOT" 2>/dev/null | head -n 80 || true
          done

      - name: Save changed decompiled classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-audit/artifact/2.1.1 /tmp/apk-audit/artifact/2.1.2
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          a=Path('/tmp/apk-audit/jadx211/sources')
          b=Path('/tmp/apk-audit/jadx212/sources')
          fa={p.relative_to(a).as_posix():p for p in a.rglob('*.java')}
          fb={p.relative_to(b).as_posix():p for p in b.rglob('*.java')}
          def norm(p):
              s=p.read_text(errors='replace')
              s=re.sub(r'0x7f[0-9a-fA-F]{6}','0x7fXXXXXX',s)
              return s
          for k in sorted(set(fa)|set(fb)):
              changed=k not in fa or k not in fb or norm(fa[k])!=norm(fb[k])
              if not changed: continue
              for ver,src in [('2.1.1',fa.get(k)),('2.1.2',fb.get(k))]:
                  if src:
                      dst=Path('/tmp/apk-audit/artifact')/ver/k
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(src,dst)
          PY
          cp /tmp/apk-audit/jadx211.log /tmp/apk-audit/artifact/
          cp /tmp/apk-audit/jadx212.log /tmp/apk-audit/artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: official-2.1.1-vs-2.1.2-jadx-diff
          path: /tmp/apk-audit/artifact
          if-no-files-found: error
          retention-days: 3
