name: Import verified upstream 2.2.2 FFmpeg video JNI

on:
  push:
    branches: [reconstruct-2.2.2]
    paths: ['.github/workflows/import-ffvideo-v222.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-verified-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruct-2.2.2
          persist-credentials: true
      - name: Extract native FFmpeg video bridge only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://github.com/just-plus-player/just-plus-player/releases/download/v2.2.2/JustPlus.Player.v2.2.2.apk' \
            -o /tmp/justplus-2.2.2.apk
          echo '1e69816c14cedc30929e9e59657a6a8ac766fcd22b584774fc85aa9ec79bd916  /tmp/justplus-2.2.2.apk' | sha256sum -c
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            unzip -p /tmp/justplus-2.2.2.apk "lib/$abi/libffvideoJNI.so" \
              > "app/src/main/jniLibs/$abi/libffvideoJNI.so"
          done
          echo '9a98e6c9ee6e53ca301910a30839ef6bd91f6b4d6103a325855ef28cdbeb34ec  app/src/main/jniLibs/arm64-v8a/libffvideoJNI.so' | sha256sum -c
          echo '836665bd468eeb2bf5ad91e0e69ac871b8ce587998a59d286dc9a85756a0ee5b  app/src/main/jniLibs/armeabi-v7a/libffvideoJNI.so' | sha256sum -c
      - name: Commit original binary interfaces to isolated migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/jniLibs/arm64-v8a/libffvideoJNI.so app/src/main/jniLibs/armeabi-v7a/libffvideoJNI.so
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import verified Just+ 2.2.2 native FFmpeg video JNI libraries'
            git push origin HEAD:reconstruct-2.2.2
          fi
