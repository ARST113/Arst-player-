name: ARX 2.4.1 experimental build and Android emulator validation

on:
  push:
    branches:
      - arx/v2.4.1-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arx-241-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate script syntax
        shell: bash
        run: |
          bash -n .github/scripts/arx-241-import-native.sh
          bash -n .github/scripts/arx-241-long-pause-smoke.sh
          bash -n .github/scripts/arx-230-emulator-smoke.sh
          bash -n .github/scripts/arx-230-tv-smoke.sh
      - name: Import upstream 2.4.1 JNI from SHA-256 pinned APK
        shell: bash
        run: bash .github/scripts/arx-241-import-native.sh
      - name: Assemble signed ARM preview and emulator debug APK; execute JVM tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleLatestUniversalRelease :app:assembleLatestUniversalDebug :app:testLatestUniversalDebugUnitTest
      - name: Validate version, package, native JNI, signature and About
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arx-241-build-evidence
          apk="$(find app/build/outputs/apk/latestUniversal/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" | tee arx-241-build-evidence/badging.txt | grep -E "name='com.justplus.player'.*versionCode='2004001'.*versionName='2.4.1-arx1-preview'"
          "$signer" verify --print-certs "$apk" | tee arx-241-build-evidence/signature.txt
          for abi in arm64-v8a armeabi-v7a; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libffmpegJNI.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libffvideoJNI.so"
          done
          test "$(unzip -p "$apk" lib/arm64-v8a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = "b9f2e4fb666ee383ec82728641ed78f1fa0d05b591e9a5dbfdd7c5a453b59567"
          test "$(unzip -p "$apk" lib/armeabi-v7a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = "2ad08381a044a5d621f2c14c17d4b2e0cb3a93c7fe1de310cbe8f6e296604574"
          test "$(unzip -p "$apk" lib/arm64-v8a/libffvideoJNI.so | sha256sum | cut -d' ' -f1)" = "9a98e6c9ee6e53ca301910a30839ef6bd91f6b4d6103a325855ef28cdbeb34ec"
          test "$(unzip -p "$apk" lib/armeabi-v7a/libffvideoJNI.so | sha256sum | cut -d' ' -f1)" = "836665bd468eeb2bf5ad91e0e69ac871b8ce587998a59d286dc9a85756a0ee5b"
          ! grep -R -E 'aboutDeco|stand_ukraine|deco_line_[12]|STAND WITH|UKRAINE' \
            app/src/main/res/xml/root_preferences.xml \
            app/src/main/java/com/brouken/player/SettingsActivity.java \
            app/src/main/res/values/strings.xml
          test ! -e app/src/main/res/layout/preference_about_deco.xml
          test ! -e app/src/main/res/layout/preference_stand_with_ukraine.xml
          grep -q 'api.github.com/repos/ARST113/Arst-player-/releases' app/src/main/java/com/brouken/player/update/Updater.java
          sha256sum "$apk" | tee arx-241-build-evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ARX-2.4.1-preview-build-apks
          path: |
            app/build/outputs/apk/latestUniversal/release/*.apk
            app/build/outputs/apk/latestUniversal/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARX-2.4.1-build-evidence
          path: |
            arx-241-build-evidence/
            app/build/test-results/testLatestUniversalDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

  android-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARX-2.4.1-preview-build-apks
          path: app/build/outputs/apk/latestUniversal
      - name: Make offline video, subtitles, AVI and long-pause fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arx-230-fixtures arx-230-evidence arx-241-pause-evidence
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 140 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k \
            -movflags +faststart arx-230-fixtures/pause.mp4
          cp arx-230-fixtures/pause.mp4 arx-230-fixtures/h264-aac.mp4
          cat > arx-230-fixtures/forced.srt <<'SRT'
          1
          00:00:03,000 --> 00:00:10,000
          English Forced
          SRT
          cat > arx-230-fixtures/full.srt <<'SRT'
          1
          00:00:04,000 --> 00:00:12,000
          Русские полные
          SRT
          ffmpeg -hide_banner -loglevel error -y -i arx-230-fixtures/h264-aac.mp4 \
            -i arx-230-fixtures/forced.srt -i arx-230-fixtures/full.srt \
            -map 0:v:0 -map 0:a:0 -map 1:0 -map 2:0 -c:v copy -c:a copy -c:s srt \
            -metadata:s:s:0 language=eng -metadata:s:s:0 title="English Forced" -disposition:s:0 forced \
            -metadata:s:s:1 language=und -metadata:s:s:1 title="Русские полные" -disposition:s:1 default \
            arx-230-fixtures/subtitles.mkv
          ffmpeg -hide_banner -loglevel error -y -i arx-230-fixtures/h264-aac.mp4 -an \
            -c:v mpeg4 -q:v 5 -vtag XVID arx-230-fixtures/mp4v.avi
          setsid python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory arx-230-fixtures </dev/null > arx-230-evidence/http-server.txt 2>&1 &
          for i in {1..20}; do curl -fsSI http://127.0.0.1:8765/pause.mp4 && break; sleep 1; done
      - name: Enable Android Emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android 15 playback, subtitles, AVI, About and 38-second resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/arx-230-emulator-smoke.sh
            bash .github/scripts/arx-241-long-pause-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARX-2.4.1-phone-emulator-evidence
          path: |
            arx-230-evidence/
            arx-241-pause-evidence/
          retention-days: 14
          if-no-files-found: warn

  tv-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARX-2.4.1-preview-build-apks
          path: app/build/outputs/apk/latestUniversal
      - name: Produce locally served TV video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arx-230-tv-fixtures arx-230-tv-evidence
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=854x480:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 60 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k \
            -movflags +faststart arx-230-tv-fixtures/tv-h264.mp4
          setsid python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory arx-230-tv-fixtures </dev/null > arx-230-tv-evidence/http-server.txt 2>&1 &
          for i in {1..20}; do curl -fsSI http://127.0.0.1:8765/tv-h264.mp4 && break; sleep 1; done
      - name: Enable Android TV Emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android TV D-pad, playback and sleep/wake
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/arx-230-tv-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARX-2.4.1-Android-TV-evidence
          path: arx-230-tv-evidence/
          retention-days: 14
          if-no-files-found: warn

  preview-release:
    needs: [build, android-emulator, tv-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARX-2.4.1-preview-build-apks
          path: app/build/outputs/apk/latestUniversal
      - name: Publish pre-release only after both emulator jobs passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/latestUniversal/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -s "$apk"
          tag="arx-v2.4.1-arx1-preview-${GITHUB_SHA:0:8}"
          cp "$apk" "ARX.TPlayer.v2.4.1-arx1-preview.apk"
          sha256sum "ARX.TPlayer.v2.4.1-arx1-preview.apk" > SHA256SUMS.txt
          gh release create "$tag" ARX.TPlayer.v2.4.1-arx1-preview.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ARX TPlayer 2.4.1-arx1 experimental preview" \
            --prerelease \
            --notes "EXPERIMENTAL, NOT FULL 2.4.1 PARITY. Carries 2.3.0 ARX port and exact official v2.4.1 FFmpeg audio JNI (SHA-256 pinned). Android 15 and TV emulators passed offline fixtures. New EQ, DD/DD+ encoding controls, DRM, picture adjustments, Ambient Light and HTTPS long-pause fix have NOT been ported. Review docs/ARX-2.4.1-port.md. Do not promote to stable without further source work and physical ATV tests."
          echo "Published preview: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
