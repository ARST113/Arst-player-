name: ARX real playback smoke

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - 'app/**'
      - '.github/scripts/playback-smoke.sh'
      - '.github/workflows/playback-smoke.yml'

jobs:
  playback-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build x86_64-capable debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Boot emulator and play a real MP4
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -camera-back none
          script: bash .github/scripts/playback-smoke.sh

      - name: Upload playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARX-real-playback-smoke
          path: |
            /tmp/arx-playback-smoke/logcat.txt
            /tmp/arx-playback-smoke/playback.png
            /tmp/arx-playback-smoke/activity.txt
            /tmp/arx-playback-smoke/http.log
            /tmp/arx-playback-smoke/smoke.mp4
          if-no-files-found: warn
          retention-days: 7
