name: Real playback smoke
# Generates and plays a real H.264/AAC MP4 inside the Android emulator.

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - '.github/workflows/real-playback-smoke.yml'
      - 'app/src/main/java/com/brouken/player/PlayerActivity.java'
      - 'app/src/main/java/com/brouken/player/Prefs.java'
      - 'app/src/main/java/com/brouken/player/Utils.java'
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/main/res/values/**'

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build x86_64-capable debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Generate a real H.264/AAC test file
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          }
          mkdir -p /tmp/arx-smoke-media playback-smoke
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 20 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -profile:v high -level 4.0 \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            /tmp/arx-smoke-media/smoke.mp4
          ffprobe -v error -show_streams -show_format /tmp/arx-smoke-media/smoke.mp4 \
            > playback-smoke/media-probe.txt
          (cd /tmp/arx-smoke-media && python3 -m http.server 8000 --bind 0.0.0.0 \
            > "$GITHUB_WORKSPACE/playback-smoke/http-server.log" 2>&1 &)

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and prove real playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/real-playback-smoke.sh

      - name: Upload playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-playback-smoke-evidence
          path: playback-smoke/
          if-no-files-found: warn
          retention-days: 7
