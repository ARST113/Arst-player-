name: Real playback smoke
# Generates and plays a real H.264/AAC MP4 inside the Android emulator.

on:
  workflow_dispatch:
  push:
    branches:
      - arx-2.1.3-port-wip
    paths:
      - '.github/workflows/real-playback-smoke.yml'
      - 'app/src/main/java/com/brouken/player/PlayerActivity.java'
      - 'app/src/main/java/com/brouken/player/Prefs.java'
      - 'app/src/main/java/com/brouken/player/Utils.java'
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/main/res/values/**'

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.3-port-wip
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build x86_64-capable debug APK
        run: ./gradlew :app:assembleLatestUniversalDebug

      - name: Generate a real H.264/AAC test file
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          }
          mkdir -p /tmp/arx-smoke-media playback-smoke
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 20 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -profile:v high -level 4.0 \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            /tmp/arx-smoke-media/smoke.mp4
          ffprobe -v error -show_streams -show_format /tmp/arx-smoke-media/smoke.mp4 \
            > playback-smoke/media-probe.txt
          (cd /tmp/arx-smoke-media && python3 -m http.server 8000 --bind 0.0.0.0 \
            > "$GITHUB_WORKSPACE/playback-smoke/http-server.log" 2>&1 &)

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and prove real playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail

            APK="$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' -type f | head -n1)"
            test -n "$APK"
            adb install -r "$APK"

            adb logcat -c
            adb shell am force-stop com.justplus.player

            adb shell am start -W \
              -n com.justplus.player/com.brouken.player.PlayerActivity \
              -a android.intent.action.VIEW \
              -d http://10.0.2.2:8000/smoke.mp4 \
              -t video/mp4 \
              > playback-smoke/am-start.txt

            # Give Media3 enough time to open HTTP, select codecs and advance the clock.
            sleep 8

            adb logcat -d -v threadtime > playback-smoke/logcat.txt
            adb shell dumpsys activity activities > playback-smoke/activity.txt
            adb shell dumpsys media.codec > playback-smoke/media-codec.txt || true

            # Playback proof from the app's own Player.Listener diagnostics.
            grep -q "state READY" playback-smoke/logcat.txt
            grep -q "playing=true" playback-smoke/logcat.txt

            # Bring controller chrome on screen and capture exactly what CI rendered.
            adb shell input tap 500 500 || true
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml playback-smoke/window.xml || true
            adb shell screencap -p /sdcard/player.png
            adb pull /sdcard/player.png playback-smoke/player.png

            # Stronger proof: if the controller exposed exo_position, it must have advanced past zero.
            python3 - <<'PY'
            import re, sys
            from pathlib import Path

            p = Path("playback-smoke/window.xml")
            if not p.exists():
                print("UI dump unavailable; READY + playing=true already proved playback.")
                sys.exit(0)

            xml = p.read_text(errors="replace")
            m = re.search(r'resource-id="com\.justplus\.player:id/exo_position"[^>]*text="([^"]+)"', xml)
            if not m:
                m = re.search(r'text="([^"]+)"[^>]*resource-id="com\.justplus\.player:id/exo_position"', xml)
            if not m:
                print("exo_position not exposed in UIAutomator; READY + playing=true already proved playback.")
                sys.exit(0)

            value = m.group(1)
            print("exo_position:", value)
            parts = [int(x) for x in value.split(":") if x.isdigit()]
            seconds = 0
            for x in parts:
                seconds = seconds * 60 + x
            if seconds <= 0:
                raise SystemExit("Playback clock did not advance past 00:00")
            PY

      - name: Upload playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-playback-smoke-evidence
          path: playback-smoke/
          if-no-files-found: warn
          retention-days: 7
