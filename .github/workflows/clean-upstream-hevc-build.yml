name: Clean upstream HEVC build

on:
  push:
    branches:
      - clean-upstream-hevc-only-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build installable universal debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleLatestUniversalDebug \
            :app:testLatestUniversalDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-upstream-hevc-universal-debug
          if-no-files-found: error
          path: app/build/outputs/apk/latestUniversal/debug/*.apk
