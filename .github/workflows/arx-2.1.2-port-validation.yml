name: ARX 2.1.2 port validation

on:
  push:
    branches:
      - arx-2.1.2-port-wip
    paths-ignore:
      - 'build-validation.txt'
      - 'apk-audit-report.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arx-2.1.2-port-wip
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleLatestUniversalDebug :app:assembleLatestUniversalRelease :app:testLatestUniversalDebugUnitTest 2>&1 | tee build-validation.log

      - name: Record validation result
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "outcome=${{ steps.build.outcome }}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo
            echo "=== build log tail ==="
            tail -n 240 build-validation.log 2>/dev/null || true
          } > build-validation.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin arx-2.1.2-port-wip
          git add build-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "CI: record 2.1.2 port validation [skip ci]"
            git push origin HEAD:arx-2.1.2-port-wip
          fi

      - name: Upload test APKs
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ARX-TPlayer-2.1.2-port-apks
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            app/build/outputs/apk/latestUniversal/release/*.apk
          if-no-files-found: error

      - name: Fail workflow when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
