name: ARX 2.4.11 preview (Android TV center-control regression)
on:
  push:
    branches: [arx/v2.4.11-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arx-2411-build-port
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install verified ARX FFmpeg binaries
        run: bash .github/scripts/arx-241-import-native.sh
      - name: Assert TV play-pause remains centered
        run: python3 .github/scripts/arx-check-tv-center.py
          python3 .github/scripts/arx-check-2411-ui-contract.py
      - name: Verify parallel package matches Lampa 1.13.3 and 1.13.4 native-playlist allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arx-lampa-refs
          for tag in v1.13.3 v1.13.4; do
            curl -fsSL --retry 3 --max-time 60 \
              "https://raw.githubusercontent.com/lampa-app/LAMPA/${tag}/app/src/main/java/top/rootu/lampa/MainActivity.kt" \
              -o "/tmp/arx-lampa-refs/${tag}.kt"
          done
          python3 .github/scripts/arx-check-lampa-player-package.py \
            /tmp/arx-lampa-refs/v1.13.3.kt /tmp/arx-lampa-refs/v1.13.4.kt
      - name: Compile, test and assemble both install identities
        run: |
          ./gradlew --no-daemon \
            :app:assembleLatestUniversalDebug :app:testLatestUniversalDebugUnitTest \
            :app:assembleLatestUniversalRelease :app:assembleLatestParallelRelease \
            :app:assembleLatestParallelDebug
      - name: Verify release signatures, display names, and separate package IDs
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/latestUniversal/release -name '*.apk' -type f | head -n1)"
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$signer" verify --print-certs "$apk"
          parallel_apk="$(find app/build/outputs/apk/latestParallel/release -name '*.apk' -type f | head -n1)"
          test -s "$parallel_apk"
          "$signer" verify --print-certs "$parallel_apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" > /tmp/arx-original.badging
          "$aapt" dump badging "$parallel_apk" > /tmp/arx-parallel.badging
          grep -q "package: name='com.justplus.player'" /tmp/arx-original.badging
          grep -q "package: name='com.lampaua.player.arx'" /tmp/arx-parallel.badging
          grep -F "application-label:'ARX TPlayer'" /tmp/arx-original.badging
          grep -F "application-label:'ARX TPlayer'" /tmp/arx-parallel.badging
          echo "PASS: same visible name; two distinct Android packages"
          sha256sum "$apk" "$parallel_apk"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARX-TPlayer-2.4.11-arx1-preview-signed
          path: app/build/outputs/apk/latestUniversal/release/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARX-TPlayer-2.4.11-debug
          path: app/build/outputs/apk/latestUniversal/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARX-TPlayer-2.4.11-LAMPA-playlists-parallel-signed
          path: app/build/outputs/apk/latestParallel/release/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARX-TPlayer-2.4.11-LAMPA-playlists-parallel-debug
          path: app/build/outputs/apk/latestParallel/debug/*.apk
          retention-days: 7
