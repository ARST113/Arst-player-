name: Extract official 2.1.3 player UI

on:
  push:
    branches:
      - audit-official-2.1.3
    paths:
      - '.github/workflows/extract-official-ui-2.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-official-ui-2.1.3
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-official-2.1.3
          fetch-depth: 0

      - name: Download official release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/just-plus-player/just-plus-player/releases/download/v2.1.3/JustPlus.Player.v2.1.3.apk \
            -o /tmp/official.apk
          echo "3e8bff06ebc1037142107c5c8321249c9a3fc4569de8d8be40e53716c5b042dc  /tmp/official.apk" | sha256sum -c -

      - name: Resolve and decode UI resources
        shell: bash
        run: |
          set -euo pipefail
          APKA="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          test -x "$APKA"
          test -x "$AAPT2"

          rm -rf official-apk-ui
          mkdir -p official-apk-ui/decoded

          "$APKA" files list /tmp/official.apk > official-apk-ui/APK_FILES.txt
          "$AAPT2" dump resources /tmp/official.apk > /tmp/resources.txt

          # Keep only the resource-table entries relevant to the released player chrome.
          grep -E -B1 -A12 \
            ':(layout|drawable)/(activity_player|activity_player_textureview|controls|exo_player_control_view|exo_player_view|exo_styled_player_view|rounded_controls_background|controls_gradient|scrim_bottom|bg_accent_pill|ic_lock_24dp|ic_screen_rotation_24dp|ic_aspect_ratio_24dp|ic_fit_screen_24dp|ic_audiotrack_24dp|ic_audiotrack_plate_24dp|ic_subtitles_24dp|ic_playlist_24dp|ic_more_vert_24dp|exo_styled_controls_play|exo_styled_controls_pause|exo_styled_controls_next)' \
            /tmp/resources.txt > official-apk-ui/SELECTED_RESOURCE_MAP.txt || true

          # Decode every XML file path exposed by those selected resource entries.
          grep -oE 'res/[A-Za-z0-9_.+@-]+\.xml' official-apk-ui/SELECTED_RESOURCE_MAP.txt \
            | sort -u > /tmp/xml-paths.txt || true

          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            out="official-apk-ui/decoded/$(basename "$rel")"
            "$APKA" resources xml --file "/$rel" /tmp/official.apk > "$out"
          done < /tmp/xml-paths.txt

          "$APKA" manifest version-name /tmp/official.apk > official-apk-ui/VERSION.txt
          sha256sum /tmp/official.apk > official-apk-ui/SHA256.txt

      - name: Commit extracted resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "arx-ui-audit"
          git config user.email "actions@users.noreply.github.com"
          git add official-apk-ui
          git diff --cached --quiet && exit 0
          git commit -m "Audit: map official 2.1.3 player UI resources"
          git pull --rebase origin audit-official-2.1.3
          git push origin HEAD:audit-official-2.1.3
