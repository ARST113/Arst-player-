name: ARX 2.2.2 reconstruction compile check

on:
  push:
    branches: [reconstruct-2.2.2]
    paths:
      - '.github/workflows/validate-2.2.2-port.yml'
      - 'app/src/main/java/com/brouken/player/PlayerActivity.java'
      - 'app/src/main/java/com/brouken/player/SettingsActivity.java'
      - 'app/src/main/java/com/brouken/player/Prefs.java'
      - 'app/src/main/java/com/brouken/player/update/**'
      - 'app/src/main/java/com/brouken/player/PlaylistApi.java'
      - 'app/src/main/java/com/brouken/player/FfmpegVideoDecoder.java'
      - 'app/src/main/java/com/brouken/player/FfmpegVideoRenderer.java'
      - 'app/src/main/jniLibs/**'
      - 'app/libs/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruct-2.2.2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile new renderer and run tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleLatestUniversalDebug :app:assembleLatestUniversalRelease \
            :app:testLatestUniversalDebugUnitTest --no-daemon 2>&1 | tee arx-222-build.log
      - name: Verify signed candidate and official FFmpeg native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/latestUniversal/release -type f -name '*.apk' | head -n1)"
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$signer" verify --verbose --print-certs "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" | grep "versionName='2.2.2-arx1'"
          for abi in arm64-v8a armeabi-v7a; do
            unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libffvideoJNI.so"
            unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libffmpegJNI.so"
          done
          test "$(unzip -p "$apk" lib/arm64-v8a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = \
            "7c50ed7526e2a78fe9c61bf3059f887f2610e23a9ecd92cedb0041c1489f0536"
          test "$(unzip -p "$apk" lib/armeabi-v7a/libffmpegJNI.so | sha256sum | cut -d' ' -f1)" = \
            "1e54c5b39726a9a907eb797099edfd5bc84dfbc152b10653eb5637bbc562c14b"
          test -s app/src/main/res/drawable-nodpi/arx_launcher_source.webp
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sha256sum "$apk"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arx-2.2.2-build-log
          path: arx-222-build.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload candidate APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arx-2.2.2-reconstruction-candidate-apks
          path: |
            app/build/outputs/apk/latestUniversal/debug/*.apk
            app/build/outputs/apk/latestUniversal/release/*.apk
          retention-days: 14
